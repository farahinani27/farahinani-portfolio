# Builds the site and rsyncs it to the Hostinger preview subdomain over
# SSH every time astro-revamp is pushed. Configure these repo secrets
# first (Settings -> Secrets and variables -> Actions):
#   SSH_PRIVATE_KEY   the deploy key (paste the whole private key, incl.
#                     the BEGIN/END lines)
#   SSH_HOST          145.79.25.209
#   SSH_PORT          65002
#   SSH_USER          u531687480
#   SSH_TARGET_DIR    domains/farahinani.com/public_html/staging/
#                     (path is relative to the account home; keep the
#                     trailing slash)
#
# Trigger a run manually from the Actions tab (workflow_dispatch) if you
# don't want to wait for the next push.
name: Deploy preview to Hostinger

on:
  push:
    branches: [astro-revamp]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set up the deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload dist/ over SSH (rsync)
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            ./dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_TARGET_DIR }}"
